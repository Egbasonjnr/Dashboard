<!doctype html>

  <body>
    <div class="app">

            <li>

            </li>
            <li>
              <a href="#"
                ><svg

                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"

                  <path d="M4 4h16v12H7l-3 3V4Z" /></svg

            </li>
            <li>

                  <circle cx="12" cy="12" r="9" />

              >
            </li>
            <li>
              <a href="#"
                ><svg
                  class="icon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path d="M6 2h9l3 3v17H6z" />
                  <path d="M9 8h6M9 12h6M9 16h4" /></svg

              >
            </li>
            <li>
              <a href="#"
                ><svg
                  class="icon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"

                  <circle cx="8" cy="8" r="3" />

                  <path
                    d="M3 20c0-3 2.5-5 5-5s5 2 5 5M14 20c0-2.5 2-4.5 5-4.5s5 2 5 4.5"
                  /></svg
                >Communities</a
              >
            </li>
          </ul>
          <ul class="nav-spacer">
            <li>
              <a href="#"
                ><svg
                  class="icon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <circle cx="12" cy="12" r="3" />
                  <path
                    d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"

                >Settings</a
              >
            </li>
            <li>
              <a href="#"
                ><svg
                  class="icon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <circle cx="12" cy="12" r="9" />
                  <path d="M12 16v-4M12 8h.01" /></svg
                >Support</a
              >
            </li>
            <li>
              <a href="#"
                ><svg
                  class="icon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path d="m9 12 2 2 4-4" />
                  <path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z" /></svg
                >Privacy</a
              >
            </li>
          </ul>
        </nav>
      </aside>

      <!-- Header -->
      <header class="header">
        <div class="search-bar">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="11" cy="11" r="7" />
            <path d="m21 21-4.3-4.3" />
          </svg>
        </div>
        <div class="header-right">
          <svg
            class="bell icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
            <path d="M13.7 21a2 2 0 0 1-3.4 0" />
          </svg>
          <div class="avatar">🐱</div>
          <span class="username">Morgan Oakley</span>
        </div>
      </header>

      <!-- Main -->
      <main class="main">
        <div class="content-col">
          <div class="greeting">
            <div class="avatar">🐱</div>
            <div class="greeting-text">
              <p>Hi there,</p>
              <h2>Morgan Oakley (@morgan)</h2>
            </div>
            <div class="greeting-actions">
              <button class="btn">New</button>
              <button class="btn">Upload</button>
              <button class="btn">Share</button>
            </div>
          </div>

          <div class="section-title">Your Projects</div>

          <div class="projects-grid" id="projects"></div>
        </div>

        <div class="side-col">
          <div class="panel">
            <h3>Announcements</h3>
            <div id="announcements"></div>
          </div>

          <div class="panel">
            <h3>Trending</h3>
            <div id="trending"></div>
          </div>
        </div>
      </main>
    </div>

    <script>
      const cardIconsSVG = `
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l2.9 6.3 6.9.7-5.2 4.6 1.6 6.8L12 16.9 5.8 20.4l1.6-6.8L2.2 9l6.9-.7z"/></svg>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v7M12 10 6 21M12 10l6 11"/><circle cx="6" cy="21" r="1.5"/><circle cx="18" cy="21" r="1.5"/></svg>
  `;

      const projects = [
        {
          name: "Super Cool Project",
          desc: "Sed tempus ut lacus ut scelerisque. Suspendisse sollicitudin nibh erat, id facilisis felis accumsan nec.",
        },
        {
          name: "Less Cool Project",
          desc: "Nullam condimentum ipsum ut lectus vehicula consectetur. Quisque sed dolor tincidunt, consectetur sapien et, facilisis dolor. Duis sem purus, dignissim ut sapien in, varius pellentesque lacus.",
        },
        {
          name: "Impossible App",
          desc: "In hac habitasse platea dictumst. Vivamus dictum rutrum arcu, a placerat velit sagittis id.",
        },
        {
          name: "Easy Peasy App",
          desc: "Etiam cursus eros ac efficitur fringilla. Vestibulum dignissim urna eget accumsan aliquam. Curabitur dignissim nisi in tortor commodo, ac bibendum magna tincidunt.",
        },
        {
          name: "Ad Blocker",
          desc: "Quisque eget rutrum nisl. Nam augue justo, cursus vitae metus vel, pharetra hendrerit felis. Aliquam sed malesuada eros.",
        },
        {
          name: "Money Maker",
          desc: "Praesent convallis, libero quis congue elementum, nunc ante faucibus sapien, ac scelerisque tortor purus sit amet ex. Pellentesque mollis nec sem vel aliquam.",
        },
      ];

      document.getElementById("projects").innerHTML = projects
        .map(
          (p) => `
    <div class="project-card">
      <h3>${p.name}</h3>
      <p>${p.desc}</p>
      <div class="card-icons">${cardIconsSVG}</div>
    </div>
  `,
        )
        .join("");

      const announcements = [
        {
          title: "Site Maintenance",
          desc: "Vestibulum condimentum tellus lacus, in accumsan elit maximus ac. Donec hendrerit sodales congue...",
        },
        {
          title: "Community Share Day",
          desc: "Nam vel lectus tincidunt, rutrum nulla eu, ornare libero. Aliquam dictum accumsan porttitor...",
        },
        {
          title: "Updated Privacy Policy",
          desc: "Phasellus efficitur nisi eget elit consectetur, eget condimentum ante auctor. Cras fringilla sagittis sem in mattis...",
        },
      ];

      document.getElementById("announcements").innerHTML = announcements
        .map(
          (a) => `
    <div class="announcement">
      <h4>${a.title}</h4>
      <p>${a.desc}</p>
    </div>
  `,
        )
        .join("");

      const trending = [
        {
          handle: "@tegan",
          label: "World Peace Builder",
          color: "#e8a0a8",
          emoji: "🐕",
        },
        {
          handle: "@morgan",
          label: "Super Cool Project",
          color: "#f2a93c",
          emoji: "🐱",
        },
        {
          handle: "@kendall",
          label: "Life Changing App",
          color: "#5a6470",
          emoji: "🧑",
        },
        {
          handle: "@alex",
          label: "No Traffic Maker",
          color: "#e8909a",
          emoji: "🐧",
        },
      ];

      document.getElementById("trending").innerHTML = trending
        .map(
          (t) => `
    <div class="trending-item">
      <div class="trending-avatar" style="background:${t.color}">${t.emoji}</div>
      <div class="trending-info">
        <strong>${t.handle}</strong>
        <span>${t.label}</span>
      </div>
    </div>
  `,
        )
        .join("");
    </script>
  </body>
</html>
